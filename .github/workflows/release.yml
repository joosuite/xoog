name: Release artifacts

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check version tag
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('The tag must match the package.json version.');
          }
          JS
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test CLI
        run: node dist/cli.js --version
      - name: Package and checksum
        run: |
          mkdir -p release
          npm pack --pack-destination release
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {readdirSync, readFileSync, writeFileSync} from 'node:fs';
          for (const file of readdirSync('release').filter(name => name.endsWith('.tgz'))) {
            const digest = createHash('sha256').update(readFileSync(`release/${file}`)).digest('hex');
            writeFileSync(`release/${file}.sha256`, `${digest}  ${file}\n`);
          }
          JS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xoog-${{ env.RELEASE_TAG }}
          path: |
            release/*.tgz
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
